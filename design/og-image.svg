  <text x="250" y="222" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#dbe8fb" letter-spacing="3">COBRANÇA CIDADÃ</text>
  <text x="250" y="284" font-family="Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff">Prometeu. Cumpriu? Cobre.</text>
  <text x="80" y="420" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#ffffff">Conferimos, uma a uma, as promessas de campanha</text>
  <text x="80" y="476" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#ffffff">do presidente Lula, com fonte pública.</text>
